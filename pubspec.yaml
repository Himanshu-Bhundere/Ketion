name: ketion
description: "Offline-first, cross-platform note-taking application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Routing
  go_router: ^14.1.0

  # Logging
  logger: ^2.5.0

  # Database
  drift: ^2.20.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Data Modeling & Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ">=3.0.3 <5.0.0"
  super_editor: 0.3.0-dev.52
  # Attachments & Media
  image_picker: ^1.1.2
  file_picker: ^8.1.1
  crypto: ^3.0.3
  image: ^4.2.0
  google_sign_in: 6.2.1
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  http: ^1.6.0
  home_widget: ^0.9.3
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  workmanager: ^0.10.7
  connectivity_plus: ^7.3.1
  open_file: ^4.0.0
  archive: ^4.0.9
  share_plus: ^12.0.2
  pdf: ^3.12.0
  printing: ^5.14.3
  desktop_drop: ^0.7.1
  flutter_math_fork: ^0.7.4
  flutter_secure_storage: ^10.3.1
  video_player: ^2.11.1
  just_audio: ^0.10.6
  super_clipboard: ^0.9.1
  super_drag_and_drop: ^0.9.1
  emoji_picker_flutter: ^4.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.11
  drift_dev: ^2.20.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8



dependency_overrides:
  test: any
  test_api: any
  matcher: any

flutter:
  uses-material-design: true
