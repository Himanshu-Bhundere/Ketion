name: Build All Platforms

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch super_editor
        run: dart run tool/patch_super_editor.dart

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

  build_android:
    name: Build Android APK
    needs: analyze_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch super_editor
        run: dart run tool/patch_super_editor.dart

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ketion-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build_web:
    name: Build Web
    needs: analyze_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch super_editor
        run: dart run tool/patch_super_editor.dart

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ketion-web-build
          path: build/web

  build_windows:
    name: Build Windows Desktop
    needs: analyze_and_test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch super_editor
        run: dart run tool/patch_super_editor.dart

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ketion-windows-build
          path: build/windows/x64/runner/Release

  build_ios:
    name: Build iOS (No Codesign)
    needs: analyze_and_test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch super_editor
        run: dart run tool/patch_super_editor.dart

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package and Ad-Hoc Sign IPA
        run: |
          # Dynamically locate Runner.app (handles Release-iphoneos or iphoneos)
          APP_PATH=$(find build/ios -type d -name "Runner.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Runner.app not found under build/ios"
            ls -la build/ios
            exit 1
          fi
          echo "Found Runner.app at: $APP_PATH"

          # Ensure build/ios/iphoneos has Runner.app for packaging and artifact upload
          mkdir -p build/ios/iphoneos
          if [ "$APP_PATH" != "build/ios/iphoneos/Runner.app" ]; then
            rm -rf build/ios/iphoneos/Runner.app
            cp -r "$APP_PATH" build/ios/iphoneos/Runner.app
          fi

          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          find Payload/Runner.app -type d -name "*.bundle" -exec codesign --force --sign - {} + 2>/dev/null || true
          find Payload/Runner.app -type f -name "*.dylib" -exec codesign --force --sign - {} + 2>/dev/null || true
          find Payload/Runner.app -type d -name "*.framework" -exec codesign --force --sign - {} + 2>/dev/null || true
          find Payload/Runner.app -type d -name "*.appex" -exec codesign --force --sign - {} + 2>/dev/null || true
          codesign --force --sign - Payload/Runner.app
          codesign -dv Payload/Runner.app
          zip -qr Ketion.ipa Payload
          rm -rf Payload

      - name: Upload iOS Runner Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ketion-ios-build
          path: |
            build/ios/iphoneos/Ketion.ipa
            build/ios/iphoneos/Runner.app